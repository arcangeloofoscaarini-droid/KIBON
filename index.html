<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyon & Max - Motos Elétricas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILO VISUAL (CSS) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
        }

        /* Menu Superior */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background-color: #14161d;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #ff3333;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #ff3333;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ff3333;
        }

        /* Banner Principal */
        .hero {
            background-color: #14161d;
            height: 35vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            border-bottom: 1px solid #222530;
        }

        .hero-content h2 {
            font-size: 36px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero-content p {
            font-size: 16px;
            color: #a0a5b5;
            margin-bottom: 20px;
        }

        .btn-principal {
            background-color: #ff3333;
            color: #ffffff;
            padding: 10px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: transform 0.2s, background-color 0.3s;
            display: inline-block;
            text-transform: uppercase;
            font-size: 13px;
        }

        .btn-principal:hover {
            background-color: #cc0000;
            transform: scale(1.05);
        }

        /* Seção do Catálogo */
        .catalogo-section {
            padding: 50px 8%;
            text-align: center;
        }

        .catalogo-section h2 {
            font-size: 30px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitulo {
            color: #a0a5b5;
            margin-bottom: 40px;
        }

        /* Grade de Produtos */
        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Cards das Motos */
        .card-produto {
            background-color: #14161d;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s, border 0.3s;
            border: 1px solid #222530;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-produto:hover {
            transform: translateY(-5px);
            border: 1px solid #ff3333;
        }

        .imagem-container {
            width: 100%;
            height: 320px;
            overflow: hidden;
            background-color: #1a1d26;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .imagem-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .card-produto:hover .imagem-container img {
            transform: scale(1.05);
        }

        .info-produto {
            padding: 20px;
            text-align: left;
        }

        .info-produto h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .tag-modelo {
            display: inline-block;
            background-color: #ff3333;
            color: #ffffff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 3px;
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .descricao {
            color: #a0a5b5;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
            height: 60px;
            overflow: hidden;
        }

        .preco-box {
            margin-bottom: 15px;
        }

        .preco-de {
            font-size: 12px;
            color: #656a7b;
            text-decoration: line-through;
            margin-bottom: 2px;
        }

        .preco {
            font-size: 26px;
            font-weight: bold;
            color: #00ff88;
        }

        /* Botão Whatsapp */
        .btn-whats {
            display: block;
            background-color: #25d366;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-size: 14px;
            text-transform: uppercase;
        }

        .btn-whats:hover {
            background-color: #20ba5a;
        }

        .btn-whats i {
            margin-right: 8px;
            font-size: 16px;
        }

        /* Rodapé */
        footer {
            background-color: #14161d;
            padding: 30px 20px;
            text-align: center;
            color: #656a7b;
            font-size: 13px;
            border-top: 1px solid #222530;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ZYON & MAX <span>MOTOS</span></div>
        <nav>
            <a href="#catalogo">Catálogo</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>Motos Elétricas de Alta Qualidade</h2>
            <p>O estoque mais completo com o melhor preço do mercado.</p>
            <a href="#catalogo" class="btn-principal">Ver Catálogo</a>
        </div>
    </section>

    <section id="catalogo" class="catalogo-section">
        <h2>Modelos Disponíveis</h2>
        <p class="subtitulo">Clique no modelo desejado para falar conosco via WhatsApp</p>

        <div class="grid-produtos" id="lista-de-motos"></div>
    </section>

    <footer>
        &copy; 2026 Zyon & Max Motos - Todos os direitos reservados.
    </footer>

    <script>
        const SEU_WHATSAPP = "5511999999999"; 

        const motos = [
            {
                nome: "Zyon Vermelha",
                categoria: "Moto Elétrica",
                descricao: "Modelo esportivo urbano com motor elétrico traseiro Hub, bateria de lítio silenciosa e zero emissões.",
                precoDe: "R$ 4.500,00",
                precoPor: "R$ 2.999,00",
                imagem: "https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?w=600&auto=format&fit=crop&q=80"
            },
            {
                nome: "Zyon Verde Limão",
                categoria: "Moto Elétrica",
                descricao: "Painel digital completo, iluminação full LED e aceleração ágil alimentada por energia limpa.",
                precoDe: "R$ 4.500,00",
                precoPor: "R$ 2.999,00",
                imagem: "https://images.unsplash.com/photo-1599819811279-d5ad9cccf838?w=600&auto=format&fit=crop&q=80"
            },
            {
                nome: "Max Vermelha",
                categoria: "Scooter Elétrica",
                descricao: "Scooter elétrica prática para o trânsito da cidade, com compartimento sob o banco e recarga rápida.",
                precoDe: "R$ 3.990,00",
                precoPor: "R$ 2.999,00",
                imagem: "https://images.unsplash.com/photo-1622359487440-575038c35b5a?w=600&auto=format&fit=crop&q=80"
            },
            {
                nome: "Max Azul",
                categoria: "Scooter Elétrica",
                descricao: "Estilo retrô moderno alimentado por motor de liga leve elétrico. Economia garantida.",
                precoDe: "R$ 3.990,00",
                precoPor: "R$ 2.999,00",
                imagem: "https://images.unsplash.com/photo-1581242371661-c884260aa2a5?w=600&auto=format&fit=crop&q=80"
            },
            {
                nome: "Max Bege",
                categoria: "Scooter Elétrica",
                descricao: "Bateria removível de fácil transporte para carregar em qualquer tomada residencial.",
                precoDe: "R$ 3.990,00",
                precoPor: "R$ 2.999,00",
                imagem: "https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?w=600&auto=format&fit=crop&q=80"
            },
            {
                nome: "Max Cinza Grafite",
                categoria: "Scooter Elétrica",
                descricao: "Design minimalista contemporâneo, equipada com freios regenerativos eletrônicos.",
                precoDe: "R$ 3.990,00",
                precoPor: "R$ 2.999,00",
                imagem: "https://images.unsplash.com/photo-1605515298946-d062f2e9da53?w=600&auto=format&fit=crop&q=80"
            }
        ];

        function carregarCatalogo() {
            const container = document.getElementById("lista-de-motos");
            container.innerHTML = ""; 

            motos.forEach(moto => {
                const textoMensagem = encodeURIComponent(`Olá! Vi no site e gostaria de saber mais informações sobre a moto ${moto.nome} que está por ${moto.precoPor}.`);
                const linkWhats = `https://wa.me/${SEU_WHATSAPP}?text=${textoMensagem}`;

                const cardHTML = `
                    <div class="card-produto">
                        <div class="imagem-container">
                            <img src="${moto.imagem}" alt="${moto.nome}" onerror="this.src='https://placehold.co/400x320?text=Foto+Indisponível'">
                        </div>
                        <div class="info-produto">
                            <span class="tag-modelo">${moto.categoria}</span>
                            <h3>${moto.nome}</h3>
                            <p class="descricao">${moto.descricao}</p>
                            <div class="preco-box">
                                <p class="preco-de">${moto.precoDe}</p>
                                <p class="preco">${moto.precoPor}</p>
                            </div>
                            <a href="${linkWhats}" target="_blank" class="btn-whats">
                                <i class="fab fa-whatsapp"></i> Tenho Interesse
                            </a>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        window.onload = carregarCatalogo;
    </script>
</body>
</html>
