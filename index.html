<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyon & Max - Motos Elétricas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILO VISUAL (CSS) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
        }

        /* Menu Superior */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background-color: #14161d;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #ff3333;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #ff3333;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ff3333;
        }

        /* Banner Principal */
        .hero {
            background-color: #14161d;
            height: 35vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            border-bottom: 1px solid #222530;
        }

        .hero-content h2 {
            font-size: 36px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero-content p {
            font-size: 16px;
            color: #a0a5b5;
            margin-bottom: 20px;
        }

        .btn-principal {
            background-color: #ff3333;
            color: #ffffff;
            padding: 10px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: transform 0.2s, background-color 0.3s;
            display: inline-block;
            text-transform: uppercase;
            font-size: 13px;
        }

        .btn-principal:hover {
            background-color: #cc0000;
            transform: scale(1.05);
        }

        /* Seção do Catálogo */
        .catalogo-section {
            padding: 50px 8%;
            text-align: center;
        }

        .catalogo-section h2 {
            font-size: 30px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitulo {
            color: #a0a5b5;
            margin-bottom: 40px;
        }

        /* Grade de Produtos */
        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Cards das Motos */
        .card-produto {
            background-color: #14161d;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s, border 0.3s;
            border: 1px solid #222530;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-produto:hover {
            transform: translateY(-5px);
            border: 1px solid #ff3333;
        }

        .imagem-container {
            width: 100%;
            height: 380px;
            overflow: hidden;
            background-color: #1a1d26;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .imagem-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .card-produto:hover .imagem-container img {
            transform: scale(1.05);
        }

        .info-produto {
            padding: 20px;
            text-align: left;
        }

        .info-produto h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .tag-modelo {
            display: inline-block;
            background-color: #ff3333;
            color: #ffffff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 3px;
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .descricao {
            color: #a0a5b5;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
            height: 60px;
            overflow: hidden;
        }

        .preco-box {
            margin-bottom: 15px;
        }

        .preco-de {
            font-size: 12px;
            color: #656a7b;
            text-decoration: line-through;
            margin-bottom: 2px;
        }

        .preco {
            font-size: 26px;
            font-weight: bold;
            color: #00ff88;
        }

        /* Botão Whatsapp */
        .btn-whats {
            display: block;
            background-color: #25d366;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-size: 14px;
            text-transform: uppercase;
        }

        .btn-whats:hover {
            background-color: #20ba5a;
        }

        .btn-whats i {
            margin-right: 8px;
            font-size: 16px;
        }

        /* Rodapé */
        footer {
            background-color: #14161d;
            padding: 30px 20px;
            text-align: center;
            color: #656a7b;
            font-size: 13px;
            border-top: 1px solid #222530;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ZYON & MAX <span>MOTOS</span></div>
        <nav>
            <a href="#catalogo">Catálogo</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>Motos Elétricas
