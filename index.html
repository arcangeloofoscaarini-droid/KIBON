<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyon & Max - Motos Elétricas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILO VISUAL DA PÁGINA (CSS) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
        }

        /* Menu Superior */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background-color: #14161d;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #ff3333;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #ff3333;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ff3333;
        }

        /* Banner Principal */
        .hero {
            background-color: #14161d;
            height: 30vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            border-bottom: 1px solid #222530;
        }

        .hero-content h2 {
            font-size: 36px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero-content p {
            font-size: 16px;
            color: #a0a5b5;
            margin-bottom: 20px;
        }

        .btn-principal {
            background-color: #ff3333;
            color: #ffffff;
            padding: 10px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: transform 0.2s, background-color 0.3s;
            display: inline-block;
            text-transform: uppercase;
            font-size: 13px;
        }

        .btn-principal:hover {
            background-color: #cc0000;
            transform: scale(1.05);
        }

        /* Seção do Catálogo */
        .catalogo-section {
            padding: 50px 8%;
            text-align: center;
        }

        .catalogo-section h2 {
            font-size: 30px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitulo {
            color: #a0a5b5;
            margin-bottom: 40px;
        }

        /* Grade de Produtos (Ajustada para exibição de texto) */
        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        /* Cards em formato de ficha técnica */
        .card-produto {
            background-color: #14161d;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s, border 0.3s;
            border: 1px solid #222530;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-produto:hover {
            transform: translateY(-3px);
            border: 1px solid #ff3333;
        }

        .info-produto h3 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #ffffff;
            text-transform: uppercase;
            border-bottom: 1px solid #222530;
            padding-bottom: 8px;
        }

        .tag-modelo {
            display: inline-block;
            background-color: #ff3333;
            color: #ffffff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 3px;
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .descricao {
            color: #a0a5b5;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .preco-box {
            margin-bottom: 20px;
            background-color: #0d0e12;
            padding: 10px;
            border-radius: 5px;
            border-left: 3px solid #00ff88;
        }

        .preco-de {
            font-size: 12px;
            color: #656a7b;
            text-decoration: line-through;
            margin-bottom: 2px;
        }

        .preco {
            font-size: 28px;
            font-weight: bold;
            color: #00ff88;
        }

        /* Botão Whatsapp */
        .btn-whats {
            display: block;
            background-color: #25d366;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-size: 14px;
            text-transform: uppercase;
        }

        .btn-whats:hover {
            background-color: #20ba5a;
        }

        .btn-whats i {
            margin-right: 8px;
            font-size: 16px;
        }

        /* Rodapé */
        footer {
            background-color: #14161d;
            padding: 30px 20px;
            text-align: center;
            color: #656a7b;
            font-size: 13px;
            border-top: 1px solid #222530;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ZYON & MAX <span>MOTOS</span></div>
        <nav>
            <a href="#catalogo">Catálogo</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>Motos Elétricas de Alta Qualidade</h2>
            <p>Consulte a disponibilidade de cores e modelos com a nossa equipe.</p>
            <a href="#catalogo" class="btn-principal">Ver Modelos</a>
        </div>
    </section>

    <section id="catalogo" class="catalogo-section">
        <h2>Tabela de Modelos</h2>
        <p class="subtitulo">Selecione o modelo desejado para consultar o estoque via WhatsApp</p>

        <div class="grid-produtos" id="lista-de-motos"></div>
    </section>

    <footer>
        &copy; 2026 Zyon & Max Motos - Todos os direitos reservados.
    </footer>

    <script>
        // Altere o número abaixo para o seu WhatsApp (com DDD, somente números)
        const SEU_WHATSAPP = "5511999999999"; 

        // Lista de produtos simplificada apenas com texto e especificações elétricas reais
        const motos = [
            {
                nome: "Zyon Vermelha",
                categoria: "Moto Elétrica",
                descricao: "Propulsão 100% elétrica por motor Hub traseiro de alta eficiência. Zero emissões, bateria de lítio recarregável e painel digital de instrumentos.",
                precoDe: "R$ 4.500,00",
                precoPor: "R$ 2.999,00"
            },
            {
                nome: "Zyon Verde Limão",
                categoria: "Moto Elétrica",
                descricao: "Alimentação limpa por energia elétrica com sistema de gerenciamento de bateria inteligente, iluminação Full LED integrada e aceleração silenciosa.",
                precoDe: "R$ 4.500,00",
                precoPor: "R$ 2.999,00"
            },
            {
                nome: "Max Vermelha",
                categoria: "Scooter Elétrica",
                descricao: "Conceito de mobilidade urbana inteligente. Equipada com freios eletrônicos regenerativos, compartimento de carga sob o assento e assoalho plano.",
                precoDe: "R$ 3.990,00",
                precoPor: "R$ 2.999,00"
            },
            {
                nome: "Max Azul",
                categoria: "Scooter Elétrica",
                descricao: "Linha urbana sustentável com motorização por indução magnética embutida no cubo. Livre de correntes, óleos ou necessidade de manutenção complexa.",
                precoDe: "R$ 3.990,00",
                precoPor: "R$ 2.999,00"
            },
            {
                nome: "Max Bege",
                categoria: "Scooter Elétrica",
                descricao: "Conforto e eficiência energética. Conta com bateria removível projetada para carregamento prático direto em qualquer tomada doméstica padrão (110v/220v).",
                precoDe: "R$ 3.990,00",
                precoPor: "R$ 2.999,00"
            },
            {
                nome: "Max Cinza Grafite",
                categoria: "Scooter Elétrica",
                descricao: "Chassi reforçado otimizado para autonomia em perímetros urbanos. Amortecimento duplo ajustável e tecnologia de controle de torque elétrico.",
                precoDe: "R$ 3.990,00",
                precoPor: "R$ 2.999,00"
            }
        ];

        function carregarCatalogo() {
            const container = document.getElementById("lista-de-motos");
            container.innerHTML = ""; 

            motos.forEach(moto => {
                const textoMensagem = encodeURIComponent(`Olá! Gostaria de consultar a disponibilidade no estoque do modelo: ${moto.nome} que está no valor promocional de ${moto.precoPor}.`);
                const linkWhats = `https://wa.me/${SEU_WHATSAPP}?text=${textoMensagem}`;

                const cardHTML = `
                    <div class="card-produto">
                        <div class="info-produto">
                            <span class="tag-modelo">${moto.categoria}</span>
                            <h3>${moto.nome}</h3>
                            <p class="descricao">${moto.descricao}</p>
                            <div class="preco-box">
                                <p class="preco-de">De: ${moto.precoDe}</p>
                                <p class="preco">Por: ${moto.precoPor}</p>
                            </div>
                            <a href="${linkWhats}" target="_blank" class="btn-whats">
                                <i class="fab fa-whatsapp"></i> Consultar Estoque
                            </a>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        window.onload = carregarCatalogo;
    </script>
</body>
</html>
